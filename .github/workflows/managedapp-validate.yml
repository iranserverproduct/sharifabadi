name: managedapp-validate

on:
  pull_request:
    paths: ["managedapp/**", ".github/workflows/managedapp-validate.yml"]
  push:
    branches: [main]
    paths: ["managedapp/**", ".github/workflows/managedapp-validate.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python managedapp/scripts/validate_apps.py
