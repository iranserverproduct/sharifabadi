function parseFigmaUrl(u) {

    if (!/(^|\.)figma\.com$/.test(url.hostname)) return null;
    const parts = url.pathname.split('/').filter(Boolean);
    let key = null; const bi = parts.indexOf('branch');
    if (bi > 0 && parts[bi + 1]) key = parts[bi + 1];
    else if (['design', 'file', 'proto'].includes(parts[0])) key = parts[1];
    const nid = (url.searchParams.get('node-id') || '').replace('-', ':');

  } catch (e) { return null; }
}
function parseMeta(t) {
  const start = t.indexOf('<'); if (start < 0) throw { code: 'meta' };
  const tag = (t.slice(start).match(/^<([\w-]+)/) || [])[1];
  const close = t.lastIndexOf('</' + tag + '>');
  const xml = close > 0 ? t.slice(start, close + tag.length + 3) : t.slice(start, t.lastIndexOf('>') + 1);
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if (doc.querySelector('parsererror')) throw { code: 'meta' };
  const root = doc.documentElement; const W = +root.getAttribute('width') || 1;
  const texts = {};
  doc.querySelectorAll('text').forEach((n) => { texts[n.getAttribute('id')] = { w: +n.getAttribute('width'), h: +n.getAttribute('height') }; });
  const out = [];
  const visible = (el) => el.getAttribute('hidden') !== 'true';
  const visit = (el, yOff) => {
    for (const c of el.children) {
      if (!visible(c)) continue;
      const w = +c.getAttribute('width'), h = +c.getAttribute('height'), y = +c.getAttribute('y') + yOff;
      if (w < W * 0.9 || h < 8) continue;
      const kids = [...c.children].filter(visible);
      const wrapper = c.tagName === 'frame' && kids.length > 1 && kids.every((k) => +k.getAttribute('width') >= W * 0.9);
      if (wrapper) visit(c, y); else out.push({ id: c.getAttribute('id'), name: c.getAttribute('name'), y, h });
    }
  };
  visit(root, 0);
  if (!out.length) out.push({ id: root.getAttribute('id'), name: root.getAttribute('name'), y: 0, h: +root.getAttribute('height') });
  out.sort((a, b) => a.y - b.y);
  return { sections: out, texts, rootName: root.getAttribute('name') };
}

  const slots = []; const re = /<p\b([^>]*)>([\s\S]*?)<\/p>/g; let m;
  while ((m = re.exec(code))) {
    const attrs = m[1];
    let inner = m[2].replace(/<br\s*\/?>/g, '\n').replace(/\{\s*["'`]([\s\S]*?)["'`]\s*\}/g, '$1').replace(/<[^>]+>/g, '').replace(/[{}]/g, '');
    inner = decode(inner).replace(/[ \t ]+/g, ' ').replace(/\s*\n\s*/g, '\n').trim();
    if (!inner) continue;
    const size = +((attrs.match(/text-\[length:[^\]]*?(\d+(?:\.\d+)?)px/) || attrs.match(/text-\[(\d+(?:\.\d+)?)px\]/) || [])[1] || 16);
    const nid = (attrs.match(/data-node-id="([^"]+)"/) || [])[1] || '';
    const box = texts[nid] || texts[nid.split(';').pop()];
    let limit;
    if (box && box.w > 0) { const per = Math.max(8, Math.floor(box.w / (size * 0.5))); const lines = Math.max(1, Math.round(box.h / (size * 1.7))); limit = per * lines; }
    else { const wm = attrs.match(/w-\[(\d+)px\]/); limit = wm ? Math.max(Math.floor(+wm[1] / (size * 0.5)), Math.ceil(inner.length * 1.15)) : Math.max(24, Math.ceil(inner.length * 1.25)); }

}

  S.unsubP.push(S.db.collection(`projects/${id}/sections`).orderBy('order').onSnapshot((q) => { if (S.pid !== id) return; S.sections = q.docs.map((d) => ({ id: d.id, ...d.data() })); syncStats(); render(); }, () => {}));
  render(); window.scrollTo(0, 0);
}
function pickSection(id) {
  S.secId = id; S.editing = false;
  if (S.unsubC) S.unsubC();
  S.unsubC = S.db.collection(`projects/${S.pid}/sections/${id}/comments`).orderBy('at').onSnapshot((q) => { S.comments = q.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
  render();
}

/* ---------- rendering ---------- */
function render() {
  const a = document.activeElement;
  const keep = a && a.id && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') ? { id: a.id, v: a.value, s: a.selectionStart, e: a.selectionEnd } : null;
  $('#side').innerHTML = sideView();
  const m = $('#main');
  if (S.fatal) m.innerHTML = `<div class="card"><h1>ایجنت محتوای لندینگ</h1><p class="error">${esc(S.fatal)}</p></div>`;
  else if (!S.ready) m.innerHTML = '<div class="card"><div class="progress"><span class="spin" aria-hidden="true"></span>در حال بارگذاری…</div></div>';
  else if (S.view === 'kit') m.innerHTML = kitView();
  else if (S.view === 'project') m.innerHTML = S.project ? projectView() : '<div class="card"><div class="progress"><span class="spin" aria-hidden="true"></span>در حال باز کردن پروژه…</div></div>';
  else m.innerHTML = projectsView();
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.value = keep.v; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
  fillNames();
}
async function fillNames() {
  const els = $$('[data-uid]'); if (!els.length || !S.user) return;
  const ids = [...new Set(els.map((e) => e.dataset.uid).filter(Boolean))]; if (!ids.length) return;
  const ps = await S.user.profiles(ids);
  els.forEach((e) => { const p = ps[e.dataset.uid]; e.textContent = (p && p.name) || 'یکی از همکاران'; });
}
function person(id) { return id ? `<span data-uid="${esc(id)}">…</span>` : '<span class="muted">—</span>'; }

function sideView() {
  const nav = (v, label, icon, on) => `<button type="button" class="nav-item${on ? ' on' : ''}" data-act="go" data-view="${v}"${on ? ' aria-current="page"' : ''}>${icon}${label}</button>`;
  const recent = S.projects.slice(0, 4).map((p) => `<button type="button" class="nav-item${S.pid === p.id ? ' on' : ''}" data-act="open" data-id="${esc(p.id)}"><span class="dot ${p.stats && p.stats.total && p.stats.approved === p.stats.total ? 'ok' : 'warn'}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name || 'بدون نام')}</span></button>`).join('');
  const me = S.me || {};
  return `<div style="display:flex;flex-direction:column;gap:4px;padding:0 8px">
      <img src="${LOGO}" alt="ایران‌سرور" style="width:128px;height:auto;display:block">
      <span class="small muted">ایجنت محتوای لندینگ</span></div>

      ${nav('kit', 'کیت برند', I.book, S.view === 'kit')}
    </nav>
    ${recent ? `<div style="display:flex;flex-direction:column;gap:2px"><span class="small muted" style="padding:0 12px;font-weight:700">اخیر</span>${recent}</div>` : ''}
    <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--line)">
      ${me.avatarUrl ? `<img src="${esc(me.avatarUrl)}" alt="" width="34" height="34" style="border-radius:50%">` : ''}
      <span style="display:flex;flex-direction:column;line-height:1.5;min-width:0"><span style="font-weight:700;font-size:14px">${esc(me.name || 'شما')}</span><span class="small muted">حساب Claude ایران‌سرور</span></span>
    </div>`;
}

function projectsView() {
  const st = (p) => {
    const s = p.stats || {};

    if (s.approved === s.total) return ['تأییدشده', 'st-ok', 'done'];
    if ((p.analysis && (p.analysis.questions || []).some((q) => !q.answer))) return ['منتظر پاسخ مدیر محصول', 'st-muted', 'waiting'];
    return ['در حال نگارش', 'st-warn', 'writing'];
  };
  const counts = { all: S.projects.length, writing: 0, waiting: 0, done: 0, none: 0 };
  S.projects.forEach((p) => { counts[st(p)[2]]++; });
  const filters = [['all', 'همه'], ['writing', 'در حال نگارش'], ['waiting', 'منتظر پاسخ'], ['done', 'تأییدشده']];
  const rows = S.projects.filter((p) => S.filter === 'all' || st(p)[2] === S.filter);

      <button type="button" class="btn" data-act="new">${I.plus}پروژه جدید</button>
    </header>
    <section class="grid4" aria-label="مراحل کار">
      ${[['۱. ورودی‌ها', 'لینک یا خروجی فیگما، بریف صفحه و توضیح مدیر محصول'], ['۲. تحلیل و سؤال', 'متن‌های جانگهدار، تناقض عددی و سؤال‌هایی که قبل از نوشتن لازم است'], ['۳. نگارش سکشن‌به‌سکشن', 'چند نسخه برای هر سکشن، با پیشنهاد و دلیل'], ['۴. سئو و خروجی', 'متاتایتل، نقشه تگ‌ها و خروجی گوگل داکس']].map(([t, d]) => `<div class="card" style="padding:16px;gap:4px"><span style="color:var(--blue);font-weight:800;font-size:14px">${t}</span><span class="small" style="color:var(--ink-2)">${d}</span></div>`).join('')}
    </section>
    <div class="cols2">
      <section class="card flush a" aria-labelledby="ph" style="display:block">
        <div class="card-head"><h2 id="ph">همه صفحه‌ها</h2>
          <div class="row" role="group" aria-label="فیلتر وضعیت">${filters.map(([f, l]) => `<button type="button" class="chip dark${S.filter === f ? ' on' : ''}" aria-pressed="${S.filter === f}" data-act="filter" data-f="${f}">${l} (${fa(counts[f] || 0)})</button>`).join('')}</div></div>
        ${!S.projectsLoaded ? '<div style="padding:22px"><div class="progress"><span class="spin" aria-hidden="true"></span>در حال خواندن پروژه‌ها…</div></div>'
        : !S.projects.length ? `<div class="empty"><h3>هنوز پروژه‌ای نیست</h3><p class="muted" style="max-width:46ch">با «پروژه جدید» لینک فیگمای صفحه را بدهید تا ایجنت سکشن‌ها را بخواند. پروژه‌ها برای همه مدیران محصول دیده می‌شوند.</p><button type="button" class="btn" data-act="new">${I.plus}اولین پروژه</button></div>`
        : `<div class="table-wrap"><table><thead><tr><th scope="col">صفحه</th><th scope="col">مسئول</th><th scope="col">پیشرفت سکشن‌ها</th><th scope="col">وضعیت</th><th scope="col">آخرین تغییر</th></tr></thead><tbody>
          ${rows.map((p) => { const s = p.stats || {}; const [l, c] = st(p); const pct = s.total ? Math.round(100 * s.approved / s.total) : 0; return `<tr class="click" data-act="open" data-id="${esc(p.id)}">
            <td><button type="button" data-act="open" data-id="${esc(p.id)}" style="border:0;background:none;padding:0;color:var(--ink);font-weight:800;cursor:pointer;text-align:right">${esc(p.name || 'بدون نام')}</button><div class="small muted ltr" style="text-align:right">${esc(p.url || '')}</div></td>
            <td>${person(p.ownerId)}</td>
            <td><div class="small" style="color:var(--ink-2)">${s.total ? `${fa(s.approved)} از ${fa(s.total)} تأییدشده` : 'سکشنی خوانده نشده'}</div><span class="bar"><span class="${pct === 100 ? 'full' : ''}" style="width:${pct}%"></span></span></td>
            <td><span class="pill ${c}">${l}</span></td><td class="muted">${ago(p.updatedAt)}</td></tr>`; }).join('')}
          </tbody></table></div>`}
      </section>
      <aside class="b">
        <section class="card" aria-labelledby="kh">

        </section>
      </aside>
    </div>`;
}

        <h1>${esc(p.name || 'بدون نام')}</h1>${p.url ? `<div class="small muted ltr" style="text-align:right">${esc(p.url)}</div>` : ''}</div>

      ${secs.length ? `<div class="stack" style="gap:8px"><div class="row between"><span class="lbl">${fa(secs.length)} سکشن خوانده شد</span><span class="hint">تیک سکشن‌هایی را بردارید که متن ندارند یا عمومی‌اند.</span></div>

      <div class="field"><span class="lbl" id="aud-l">مخاطب اصلی</span><div class="row" role="group" aria-labelledby="aud-l">
        ${[...new Set([...AUD, ...(b.audience || [])])].map((a) => { const on = (b.audience || []).includes(a); return `<button type="button" class="chip${on ? ' on' : ''}" aria-pressed="${on}" data-act="aud" data-v="${esc(a)}">${esc(a)}</button>`; }).join('')}
        <label class="vh" for="f-aud">مخاطب دیگر</label><input class="inp" id="f-aud" placeholder="مخاطب دیگر + Enter" style="width:200px" data-act="audadd"></div></div>
      <div class="grid2">

          <div class="row" style="gap:6px">${CONVS.map((g) => `<button type="button" class="chip" style="min-height:34px;font-size:13px" data-act="suggest" data-field="conversion" data-v="${esc(g)}">${esc(g)}</button>`).join('')}</div></div>

          <div class="field"><label class="lbl" for="f-kw2">کلمه‌های فرعی</label><input class="inp" id="f-kw2" data-p="brief.kw2" value="${esc(b.kw2)}" placeholder="با ویرگول جدا کنید"></div></div>

        <span class="hint">ایجنت این توضیحات را بر منابع دیگر مقدم می‌داند و هر جا با کیت برند تناقض داشته باشد، از شما می‌پرسد.</span></div>

  </div>
  <aside class="b">
    <section class="card" aria-labelledby="rdy"><h2 id="rdy">آمادگی ورودی‌ها</h2>

      <button type="button" class="btn" data-act="analyze"${dis}${secs.length && S.sample ? '' : ' disabled'}>شروع تحلیل ${I.next}</button>

  </aside></div>`;
}

function analysisTab(p) {
  const a = p.analysis; const dis = anyBusy() ? ' disabled' : '';
  if (!a) return `<section class="card"><div class="empty"><h2>هنوز تحلیلی انجام نشده</h2><p class="muted" style="max-width:52ch">ایجنت متن فعلی طرح را با کیت برند و توضیحات شما مقایسه می‌کند، مشکلات را نشان می‌دهد و سؤال‌هایش را می‌پرسد.</p>
    ${S.err.analyze ? `<p class="error">${esc(S.err.analyze)}</p>` : ''}
    <button type="button" class="btn" data-act="analyze"${dis}${S.sections.length && S.sample ? '' : ' disabled'}>شروع تحلیل</button>${S.sections.length ? '' : '<p class="hint">اول در «ورودی‌ها» طرح را بخوانید.</p>'}</div></section>`;
  const qs = a.questions || []; const open = qs.filter((q) => !q.answer).length;
  const iss = a.issues || []; const cnt = (k) => fa(iss.filter((x) => x.kind === k).length);
  const kindPill = { serious: ['جدی', 'st-warn'], conflict: ['تناقض', 'st-dark'], copied: ['کپی‌شده', 'st-muted'] };
  return `<section class="grid4" aria-label="خلاصه تحلیل">
      ${[[cnt('serious'), 'مشکل جدی در متن فعلی'], [cnt('conflict'), 'تناقض با واقعیت‌ها'], [cnt('copied'), 'متن کپی‌شده یا تکراری'], [fa(open), 'سؤال باز از شما']].map(([n, t], i) => `<div class="card" style="padding:16px;gap:2px"><span style="font-size:26px;font-weight:800;color:${i === 3 ? 'var(--blue)' : i < 2 ? 'var(--orange-ink)' : 'var(--ink)'}">${n}</span><span class="small" style="color:var(--ink-2)">${t}</span></div>`).join('')}
    </section>
    ${S.err.analyze ? `<p class="error">${esc(S.err.analyze)}</p>` : ''}
    <div class="cols2" style="flex-direction:row-reverse">
      <div class="a">
        <section class="card flush" aria-labelledby="ih"><div class="card-head"><div class="stack" style="gap:2px"><h2 id="ih">آنچه در متن فعلی طرح پیدا شد</h2><p class="small muted">متن جانگهدار فیگما ملاک نیست؛ هر مورد با پیشنهاد اصلاح آمده است.</p></div></div>
          <ul class="list">${iss.length ? iss.map((x) => `<li><div class="row" style="gap:8px"><span class="pill ${(kindPill[x.kind] || kindPill.copied)[1]}">${(kindPill[x.kind] || kindPill.copied)[0]}</span><span class="small muted">سکشن ${esc(x.section)}</span></div>
            <span style="font-weight:700">${esc(x.title)}</span><div class="row small" style="color:var(--ink-2);align-items:flex-start;flex-wrap:nowrap">${I.next}<span>${esc(x.fix)}</span></div></li>`).join('') : '<li class="muted">مشکلی پیدا نشد.</li>'}</ul></section>
        <section class="card flush" aria-labelledby="fh"><div class="card-head"><h2 id="fh">برگه واقعیت‌های این صفحه</h2><span class="small muted">ایجنت فقط از این‌ها و کیت برند عدد می‌آورد</span></div>
          <div class="table-wrap"><table><thead><tr><th scope="col">واقعیت</th><th scope="col">مقدار</th><th scope="col">منبع</th><th scope="col"><span class="vh">حذف</span></th></tr></thead><tbody>
          ${(a.facts || []).map((f, i) => `<tr><td>${esc(f.k)}</td><td style="font-weight:700">${esc(f.v)}</td><td class="muted">${esc(f.src)}</td><td style="padding:4px"><button type="button" class="icon-btn" aria-label="حذف واقعیت" data-act="fact-del" data-i="${i}">${I.x}</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">واقعیتی ثبت نشده.</td></tr>'}
          </tbody></table></div></section>
      </div>
      <section class="card b" aria-labelledby="qh" style="flex-basis:400px">
        <div class="stack" style="gap:2px"><h2 id="qh">سؤال‌های ایجنت از شما</h2><p class="small muted">پاسخ‌ها در همین پروژه ذخیره می‌شوند و در نوشتن همه سکشن‌ها به کار می‌روند.</p></div>
        ${qs.map((q, i) => `<div class="q${q.answer ? '' : ' open'}">
          <div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><span style="font-weight:700">${esc(q.text)}</span><span class="pill ${q.answer ? 'st-ok' : 'st-warn'}">${q.answer ? 'پاسخ داده شد' : 'منتظر پاسخ'}</span></div>
          ${q.why ? `<span class="small muted">${esc(q.why)}</span>` : ''}
          <div class="row" role="group" aria-label="گزینه‌ها">${(q.options || []).map((o) => `<button type="button" class="opt${q.answer === o ? ' on' : ''}" aria-pressed="${q.answer === o}" data-act="answer" data-q="${i}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
          <label class="vh" for="qa-${i}">پاسخ دیگر</label><input class="inp" id="qa-${i}" data-qfree="${i}" placeholder="پاسخ دیگر…" value="${esc((q.options || []).includes(q.answer) ? '' : q.answer || '')}">
          ${q.answer ? `<button type="button" class="btn2" data-act="q2kit" data-q="${i}" style="align-self:flex-start;min-height:36px">ثبت در کیت برند به‌عنوان واقعیت</button>` : ''}
        </div>`).join('') || '<p class="muted">سؤالی نیست.</p>'}
        <div class="row"><button type="button" class="btn" data-act="tab" data-tab="write">شروع نگارش ${I.next}</button><button type="button" class="btn2" data-act="analyze"${dis}>تحلیل دوباره</button></div>
        ${open ? '<p class="hint">می‌توانید بدون پاسخ همه سؤال‌ها شروع کنید؛ ایجنت جای داده‌های نامعلوم را [داخل کروشه] خالی می‌گذارد.</p>' : ''}
      </section>
    </div>`;
}

function curVariantIndex(sec) { const v = S.variantView[sec.id]; return v != null && sec.variants && sec.variants[v] ? v : (sec.chosen != null ? sec.chosen : (sec.recommended || 0)); }
function computeChecks(sec, fields) {
  const out = []; const k = S.kit || {}; const all = Object.values(fields || {}).join('\n');
  (k.banned || []).forEach((w) => { if (w && all.includes(w)) out.push([0, `واژه ممنوع: «${w}»`]); });
  (k.glossary || []).forEach((g) => String(g.avoid || '').split(/[،,]/).map((s) => s.trim()).filter(Boolean).forEach((a) => { if (all.includes(a)) out.push([0, `به‌جای «${a}» بنویسید «${g.name}»`]); }));
  (sec.slots || []).forEach((s, i) => { const t = (fields || {})[s.key] || ''; if (t.length > s.limit) out.push([0, `${slotLabel(s, i)} حدود ${fa(t.length - s.limit)} کاراکتر از جای طرح بلندتر است`]); });
  if (/[0-9]/.test(all.replace(/[A-Za-z][A-Za-z0-9.\-]*/g, ''))) out.push([0, 'عدد لاتین در متن هست؛ اعداد فارسی بنویسید']);
  if (/\[[^\]]+\]/.test(all)) out.push([0, 'جای خالی [داخل کروشه] باید با داده واقعی پر شود']);
  if (!out.length) out.push([1, 'واژه ممنوع، نام نادرست محصول، عدد لاتین یا متن بلندتر از طرح پیدا نشد']);
  return out;
}

function writeTab(p) {
  const secs = sectionsIncluded();
  if (!secs.length) return `<section class="card"><div class="empty"><h2>سکشنی برای نوشتن نیست</h2><p class="muted">اول در «ورودی‌ها» طرح را بخوانید.</p><button type="button" class="btn" data-act="tab" data-tab="inputs">رفتن به ورودی‌ها</button></div></section>`;
  if (!S.secId || !secs.find((s) => s.id === S.secId)) { setTimeout(() => pickSection(secs[0].id)); return ''; }
  const sec = secs.find((s) => s.id === S.secId);
  const dis = anyBusy() ? ' disabled' : '';
  const vi = curVariantIndex(sec); const v = (sec.variants || [])[vi];
  const st = STATUS[sec.status || 'empty'] || STATUS.empty;
  const fields = v ? v.fields || {} : {};
  return `<div class="cols3">
    <nav class="card c1" aria-label="سکشن‌ها" style="padding:12px 8px;gap:2px">
      <span class="small muted" style="padding:4px 10px;font-weight:700">سکشن‌ها به ترتیب طرح</span>
      ${secs.map((s) => { const t = STATUS[s.status || 'empty'] || STATUS.empty; return `<button type="button" class="sec-btn${s.id === sec.id ? ' on' : ''}" data-act="sec" data-id="${esc(s.id)}"${s.id === sec.id ? ' aria-current="true"' : ''}><span class="dot ${t[2]}"></span><span style="flex:1 1 auto;min-width:0">${esc(s.name || s.figmaName)}</span><span class="small muted" style="font-weight:500">${t[0]}</span></button>`; }).join('')}
      <button type="button" class="btn2" data-act="write-all" style="margin-top:8px"${dis}${S.sample ? '' : ' disabled'}>نوشتن همه سکشن‌های خالی</button>
    </nav>
    <div class="c2">
      <section class="card" aria-labelledby="sh">
        <div class="row between"><div class="stack" style="gap:0"><h2 id="sh">${esc(sec.name || sec.figmaName)}</h2>${sec.intent ? `<span class="small muted">${esc(sec.intent)}</span>` : ''}</div><span class="pill ${st[1]}">${st[0]}</span></div>
        ${sec.preview ? `<img class="thumb" src="${esc(sec.preview)}" alt="تصویر سکشن ${esc(sec.name || '')} در طرح">` : ''}
        ${S.err.write ? `<p class="error">${esc(S.err.write)}</p>` : ''}
        ${!v ? `<div class="empty" style="padding:20px"><p class="muted">برای این سکشن هنوز متنی نوشته نشده.</p><button type="button" class="btn" data-act="write"${dis}${S.sample ? '' : ' disabled'}>نوشتن ${fa(p.variantsCount || 3)} نسخه</button></div>` : `
        <div class="row between"><div class="seg" role="tablist" aria-label="نسخه‌ها">${sec.variants.map((x, i) => `<button type="button" role="tab" class="${i === vi ? 'on' : ''}" aria-selected="${i === vi}" data-act="variant" data-i="${i}">${esc(x.label || 'نسخه ' + fa(i + 1))}${i === sec.recommended ? ' ★' : ''}${i === sec.chosen && sec.status === 'approved' ? ' ✓' : ''}</button>`).join('')}</div></div>
        <div class="soft stack" style="gap:6px"><span style="font-weight:800;color:var(--blue);font-size:14px">${esc(v.angle || '')}${vi === sec.recommended ? ' · پیشنهاد ایجنت' : ''}</span>
          ${vi === sec.recommended && sec.recommendation ? `<span class="small" style="color:var(--ink-2)">${esc(sec.recommendation)}</span>` : ''}
          ${(v.why || []).length ? `<ul style="margin:0;padding-inline-start:18px;font-size:14px;color:var(--ink-2)">${v.why.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}</div>
        <div class="stack" style="gap:8px">${(sec.slots || []).map((s, i) => { const t = fields[s.key] || ''; const over = t.length > s.limit; return `<div class="slot">
          <div class="meta"><span style="font-weight:700;color:var(--ink-2)">${slotLabel(s, i)}</span><span>${fa(s.size)}px</span><span class="${over ? 'over' : ''}">${fa(t.length)} از حدود ${fa(s.limit)} کاراکتر</span></div>
          ${s.text ? `<span class="old">${esc(clip(s.text, 220))}</span>` : ''}
          ${S.editing ? `<label class="vh" for="ef-${esc(s.key)}">${slotLabel(s, i)}</label><textarea class="ta" rows="${Math.min(6, Math.max(1, Math.ceil(t.length / 70)))}" id="ef-${esc(s.key)}" data-ef="${esc(s.key)}">${esc(t)}</textarea>` : `<span class="new"${s.size >= 20 ? ' style="font-weight:800;font-size:17px"' : ''}>${esc(t) || '<span class="muted">—</span>'}</span>`}</div>`; }).join('')}</div>
        <div class="row">
          ${S.editing ? `<button type="button" class="btn" data-act="edit-save">ذخیره ویرایش</button><button type="button" class="btn2" data-act="edit-cancel">انصراف</button>` : `
          <button type="button" class="btn" data-act="approve"${dis}>${I.check.replace('color:var(--blue)', 'color:currentColor')}${sec.status === 'approved' && sec.chosen === vi ? 'تأیید شد' : 'تأیید این نسخه'}</button>
          <button type="button" class="btn2" data-act="edit">${I.pen}ویرایش دستی</button>
          <button type="button" class="btn2" data-act="waiting">${sec.status === 'waiting' ? 'برداشتن «منتظر داده»' : 'منتظر داده بماند'}</button>`}
        </div>
        <div class="stack" style="gap:8px;border-top:1px solid var(--line);padding-top:14px">
          <label class="lbl" for="rw">بازنویسی این نسخه با دستور شما</label>
          <div class="row">${['کوتاه‌تر', 'رسمی‌تر', 'ساده‌تر برای مخاطب غیرفنی', 'مخاطب سازمانی‌تر', 'بدون عدد و قیمت'].map((q) => `<button type="button" class="chip" data-act="rw-quick" data-v="${q}"${dis}>${q}</button>`).join('')}</div>
          <div class="row" style="align-items:stretch"><textarea class="ta" id="rw" rows="2" placeholder="مثلاً: زیرتیتر را به یک جمله برسان و «پلن رایگان» را نگه دار" style="flex:1 1 300px;width:auto">${esc(S.rwText)}</textarea>
            <button type="button" class="btn2" data-act="rewrite" style="align-self:flex-end"${dis}>${I.redo}بازنویسی</button></div>
          <button type="button" class="btn2" data-act="write" style="align-self:flex-start"${dis}>${I.redo}نوشتن دوباره همه نسخه‌ها</button>
        </div>`}
      </section>
    </div>
    <aside class="c3">
      ${v ? `<section class="card" aria-labelledby="vch"><h2 id="vch" style="font-size:16px">بررسی لحن و قواعد</h2>
        ${computeChecks(sec, fields).map(([ok, t]) => `<div class="check">${ok ? I.check : I.warn}<span>${esc(t)}</span></div>`).join('')}</section>
      <section class="card" aria-labelledby="fch"><h2 id="fch" style="font-size:16px">واقعیت‌های به‌کاررفته</h2>
        ${(v.facts || []).map((f) => `<div class="soft" style="padding:10px 12px"><div style="font-weight:700;font-size:14px">${esc(f.claim)}</div><div class="small muted">${esc(f.src)}</div></div>`).join('') || '<p class="small muted">این نسخه عدد یا ادعای مشخصی ندارد.</p>'}</section>` : ''}
      ${(sec.notes || []).length ? `<section class="card" aria-labelledby="nh"><h2 id="nh" style="font-size:16px">یادداشت ایجنت</h2>${sec.notes.map((n) => `<div class="check">${I.warn}<span>${esc(n)}</span></div>`).join('')}</section>` : ''}
      <section class="card" aria-labelledby="cmh"><h2 id="cmh" style="font-size:16px">گفت‌وگوی تیم</h2>
        ${S.comments.map((c) => `<div class="small" style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:700">${person(c.by)} <span class="muted" style="font-weight:400">· ${ago(c.at)}</span></span><span style="color:var(--ink-2);white-space:pre-line">${esc(c.text)}</span></div>`).join('') || '<p class="small muted">هنوز نظری نیست.</p>'}
        <label class="vh" for="cm">نوشتن نظر</label><textarea class="ta" id="cm" rows="2" placeholder="نظر یا سؤال درباره این سکشن…"></textarea>
        <button type="button" class="btn2" data-act="comment" style="align-self:flex-start">ارسال نظر</button></section>
    </aside></div>`;
}

function seoTab(p) {

  const secs = sectionsIncluded(); const appr = secs.filter((s) => s.status === 'approved').length;
  const tl = (seo && seo.title || '').length, dl = (seo && seo.desc || '').length;
  return `<div class="cols2"><div class="a">

      <button type="button" class="btn" data-act="seo"${dis}${S.sample ? '' : ' disabled'}>ساخت ساختار سئو</button></div></section>` : `

      <div class="serp" aria-label="پیش‌نمایش نتیجه گوگل"><span class="small muted ltr" style="text-align:right">${esc((p.url || '').replace(/^https?:\/\//, ''))}</span><span class="t">${esc(seo.title)}</span><span class="small" style="color:var(--ink-2)">${esc(seo.desc)}</span></div>
      <div class="field"><div class="row between"><label class="lbl" for="s-t">Meta Title</label><span class="small ${tl > 60 ? 'over' : 'muted'}">${fa(tl)} از ۶۰</span></div><input class="inp" id="s-t" data-p="seo.title" value="${esc(seo.title)}"></div>
      <div class="field"><div class="row between"><label class="lbl" for="s-d">Meta Description</label><span class="small ${dl > 155 ? 'over' : 'muted'}">${fa(dl)} از ۱۵۵</span></div><textarea class="ta" id="s-d" rows="3" data-p="seo.desc">${esc(seo.desc)}</textarea></div>
    </section>
    <section class="card flush" aria-labelledby="th"><div class="card-head"><h2 id="th">نقشه تگ‌های عنوان</h2><div class="row small">${['H1', 'H2', 'H3'].map((t) => `<span class="pill st-muted">${fa((seo.tags || []).filter((x) => x.tag === t).length)} ${t}</span>`).join('')}</div></div>
      <ol class="list">${(seo.tags || []).map((t) => `<li style="flex-direction:row;align-items:center;gap:12px;padding-inline-start:${t.tag === 'H3' || t.tag === 'H4' || t.tag === 'P' ? 46 : 22}px"><span class="tagb t${esc(t.tag)}">${esc(t.tag)}</span><span style="flex:1 1 auto;min-width:0">${esc(t.text)}</span><span class="small muted">${esc(t.section)}</span></li>`).join('')}</ol>
      ${(seo.tags || []).filter((t) => t.tag === 'H1').length !== 1 ? '<p class="error" style="margin:12px 22px">صفحه باید دقیقاً یک H1 داشته باشد.</p>' : ''}</section>
    ${(seo.schema || []).length || (seo.links || []).length || (seo.notes || []).length ? `<section class="card" aria-labelledby="xh"><h2 id="xh">اسکیما، لینک داخلی و نکته‌ها</h2>
      ${(seo.schema || []).length ? `<div class="row">${seo.schema.map((x) => `<span class="pill st-ok ltr">${esc(x)}</span>`).join('')}</div>` : ''}
      ${[...(seo.links || []), ...(seo.notes || [])].map((n) => `<div class="check">${I.check}<span>${esc(n)}</span></div>`).join('')}</section>` : ''}`}
  </div>
  <aside class="b">

async function importFigma() {
  const p = S.project; setErr('import', null);
  const f = parseFigmaUrl(p.figmaUrl || ($('#f-figma') && $('#f-figma').value) || '');
  if (!f || !f.key) return setErr('import', 'لینک فیگما معتبر نیست. لینک باید با figma.com/design شروع شود.');
  if (!f.nodeId) return setErr('import', 'لینک به یک فریم اشاره نمی‌کند. در فیگما روی فریم صفحه راست‌کلیک کنید و Copy link to selection را بزنید.');
  const pid = S.pid;
  try {
    setBusy('import', 'اتصال به فیگما…');
    let sessionId;
    try { const ses = await S.mcp.callTool(FIGMA, 'create_session', { fileKey: f.key, description: 'Iran Server content agent: read the page frame to write landing copy' }); sessionId = ses.payload && ses.payload.sessionId; } catch (e) { if (e && e.code !== 'tool_error') throw e; }
    const base = sessionId ? { sessionId } : {};
    setBusy('import', 'خواندن ساختار صفحه…');
    const meta = parseMeta(resText(await callRead(FIGMA, 'get_metadata', { fileKey: f.key, nodeId: f.nodeId, ...base })));
    const existing = Object.fromEntries(S.sections.map((s) => [s.figmaId, s]));
    const sharedRe = /^(header|footer|nav|navbar|menu)/i;
    for (let i = 0; i < meta.sections.length; i++) {
      if (S.pid !== pid) return;
      const sm = meta.sections[i];
      setBusy('import', `خواندن سکشن ${fa(i + 1)} از ${fa(meta.sections.length)}: ${sm.name}`);
      let slots = [], preview = null, shot = null;
      try { slots = extractSlots(resText(await callRead(FIGMA, 'get_design_context', { fileKey: f.key, nodeId: sm.id, excludeScreenshot: true, clientFrameworks: 'unknown', clientLanguages: 'html', ...base })), meta.texts); } catch (e) { if (e && e.code !== 'tool_error') throw e; }
      try { const r = await callRead(FIGMA, 'get_screenshot', { fileKey: f.key, nodeId: sm.id, maxDimension: 1400, enableBase64Response: true, ...base }); shot = resImage(r); } catch (e) { if (e && e.code !== 'tool_error') throw e; }
      if (shot && S.assets) { try { preview = (await S.assets.upload(shot)).url; } catch (e) {} }
      let name = '';
      if (!slots.length && shot && S.imgLimits) { try { const x = await slotsFromImage(shot); slots = x.slots; name = x.name; } catch (e) {} }
      const old = existing[sm.id];
      const id = old ? old.id : S.db.collection(`projects/${pid}/sections`).doc().id;
      const body = { order: i, figmaId: sm.id, figmaName: sm.name, slots, preview: preview || (old && old.preview) || null };
      if (old) await S.db.doc(`projects/${pid}/sections/${id}`).update(body);
      else await S.db.doc(`projects/${pid}/sections/${id}`).set({ ...body, name: name || '', intent: '', include: !sharedRe.test(sm.name) && slots.length > 0, status: 'empty', variants: [], recommended: 0, chosen: null, notes: [] });
    }
    const keep = new Set(meta.sections.map((s) => s.id));
    for (const s of S.sections) if (!keep.has(s.figmaId) && s.figmaId) await S.db.doc(`projects/${pid}/sections/${s.id}`).update({ include: false, removedFromDesign: true });
    await updateProject({ figmaKey: f.key, figmaNode: f.nodeId, figmaName: meta.rootName });
    toast(`${fa(meta.sections.length)} سکشن از فیگما خوانده شد.`);
  } catch (e) {
    setErr('import', e && e.code === 'meta' ? 'ساختار فریم خوانده نشد. لینک را بررسی کنید.' : mcpMsg(e, FIGMA));
  } finally { setBusy('import', null); }
}

async function uploadImages(files) {
  const pid = S.pid; setErr('import', null);
  const list = [...files]; let order = S.sections.reduce((m, s) => Math.max(m, s.order || 0), -1) + 1;
  try {
    for (let i = 0; i < list.length; i++) {
      setBusy('import', `خواندن تصویر ${fa(i + 1)} از ${fa(list.length)}…`);
      const file = list[i];
      const up = await S.assets.upload(file);
      let x = { name: '', slots: [] };
      try { x = await slotsFromImage(file); } catch (e) { setErr('import', sampleMsg(e)); }
      await S.db.collection(`projects/${pid}/sections`).doc().set({ order: order++, figmaId: '', figmaName: file.name, name: x.name, intent: '', slots: x.slots, preview: up.url, include: true, status: 'empty', variants: [], recommended: 0, chosen: null, notes: [] });
    }
    toast('تصویرها اضافه شدند.');
  } catch (e) { setErr('import', e && e.code ? 'آپلود انجام نشد: ' + (e.message || e.code) : 'آپلود انجام نشد.'); }
  finally { setBusy('import', null); }
}

async function analyze() {
  const p = S.project; setErr('analyze', null);
  if (!S.sections.length) return;
  S.tab = 'analysis'; setHash('p-' + S.pid);
  const excluded = S.sections.filter((s) => s.include === false).map((s) => s.figmaName).join('، ');
  const prompt = `${ROLE}
داری طرح یک لندینگ را قبل از نوشتن متن تحلیل می‌کنی. متنی که الان در طرح هست جانگهدار یا پیش‌نویس است و منبع واقعیت نیست.

${kitBlock()}

${projectBlock(p)}

## سکشن‌های طرح به ترتیب (متن فعلی هر کدام)
${clip(sectionsOutline(true), 30000)}
سکشن‌های کنارگذاشته (عمومی): ${excluded || '-'}

## کارها
۱. مشکلات متن فعلی طرح را پیدا کن: نام رقیب، Lorem ipsum یا متن جانگهدار، عدد یا ادعای مغایر با واقعیت‌های کیت برند، متنی که آشکارا از صفحه محصول دیگری کپی شده، متن یکسان در کارت‌های مختلف. kind یکی از serious، conflict، copied.
۲. برای هر سکشن یک نام کوتاه فارسی (مثل هیرو، سرویس‌ها، راهکارها، سؤالات متداول) و یک جمله هدف بنویس: متن این سکشن در همین صفحه باید چه کاری بکند.
۳. واقعیت‌هایی را که این صفحه لازم دارد و منبعشان در کیت برند، توضیحات مدیر محصول یا متن منابع هست فهرست کن، با منبع. هیچ عددی نساز.
۴. سؤال‌هایی را که قبل از نوشتن باید مدیر محصول جواب بدهد بپرس (داده ناموجود، تناقض، تصمیم). ۳ تا ۷ سؤال، هر کدام با ۲ یا ۳ گزینه کوتاه؛ گزینه پیشنهادی‌ات را اول بگذار و آخرش « (پیشنهاد)» بنویس.

فقط یک شیء JSON برگردان، مقدارها فارسی:
{"sections":[{"id":"...","name":"...","intent":"..."}],"issues":[{"kind":"serious","section":"نام سکشن","title":"...","fix":"..."}],"facts":[{"k":"...","v":"...","src":"..."}],"questions":[{"text":"...","why":"...","options":["...","..."]}]}`;
  try {
    setBusy('analyze', 'ایجنت طرح و کیت برند را تحلیل می‌کند…');
    const j = parseJSON(await ask(prompt));
    const prevQ = Object.fromEntries(((p.analysis && p.analysis.questions) || []).map((q) => [q.text, q.answer]));
    const analysis = {
      at: now(), by: (S.me && S.me.id) || null,
      issues: (j.issues || []).map((x) => ({ kind: x.kind || 'copied', section: x.section || '', title: x.title || '', fix: x.fix || '' })),
      facts: (j.facts || []).map((x) => ({ k: x.k || '', v: x.v || '', src: x.src || '' })),
      questions: (j.questions || []).map((q) => ({ text: q.text || '', why: q.why || '', options: (q.options || []).map(String), answer: prevQ[q.text] || '' })),
    };
    await updateProject({ analysis });
    for (const s of j.sections || []) { const sec = S.sections.find((x) => x.id === s.id); if (sec) await updateSection(sec.id, { name: s.name || sec.name || '', intent: s.intent || '' }); }
  } catch (e) { setErr('analyze', sampleMsg(e)); }
  finally { setBusy('analyze', null); }
}

function writePrompt(p, sec, n, hasImage) {
  return `${ROLE}
متن یک سکشن از لندینگ زیر را بنویس.

${kitBlock()}

${projectBlock(p)}

## فهرست کل صفحه (برای زمینه؛ چیزی را که سکشن‌های دیگر می‌گویند تکرار نکن)
${clip(sectionsOutline(false), 6000)}

## این سکشن: ${sec.name || sec.figmaName}${sec.intent ? ' — ' + sec.intent : ''}
جای متن‌ها در طرح (برای همه بنویس؛ هر کدام حدوداً در سقف کاراکترش؛ متن فعلی منبع واقعیت نیست):
${(sec.slots || []).map((s, i) => `- ${s.key} · ${slotLabel(s, i)} · ${s.size}px · حدود ${s.limit} کاراکتر · متن فعلی: «${clip(s.text, 300)}»`).join('\n')}
${hasImage ? 'تصویر پیوست، همین سکشن در طرح است؛ از آن برای فهم نقش هر متن (تیتر، زیرتیتر، دکمه، آیتم کارت) استفاده کن.' : ''}

## قواعد
- فارسی، مشاوره‌محور، دقیق و بدون اغراق؛ قواعد لحن کیت برند را دقیق رعایت کن.
- فقط از واقعیت‌های کیت برند، واقعیت‌های صفحه، توضیحات و پاسخ‌های مدیر محصول استفاده کن. اگر جایی داده‌ای لازم است که نداری (نقل‌قول مشتری، عدد نتیجه، قیمت)، جایش را [داخل کروشه] خالی بگذار و در notes بنویس.
- اعداد فارسی با جداکننده «٬»؛ اصطلاحات فنی انگلیسی بمانند (S3، CDN، API).
- دکمه‌ها ۲ تا ۴ کلمه با فعل.
- تعداد و ترتیب جای متن‌ها ثابت است؛ برای هر key دقیقاً یک متن.
${n} نسخه با زاویه‌های واقعاً متفاوت بنویس. اگر ترکیب دو نسخه بهتر است، یک نسخه دیگر با label «پیشنهاد ترکیبی» اضافه کن و آن را پیشنهاد بده.

فقط یک شیء JSON برگردان:
{"variants":[{"label":"نسخه ۱","angle":"زاویه در یک خط","fields":{"s1":"...","s2":"..."},"why":["دلیل کوتاه"],"facts":[{"claim":"...","src":"..."}]}],"recommended":0,"recommendation":"دلیل پیشنهاد در یک یا دو جمله","notes":["چیزی که مدیر محصول باید بدهد یا بررسی کند"],"needs_data":false}`;
}
function cleanVariant(v, sec) {
  const fields = {}; (sec.slots || []).forEach((s) => { fields[s.key] = String((v.fields || {})[s.key] || '').trim(); });
  return { label: v.label || '', angle: v.angle || '', fields, why: (v.why || []).map(String), facts: (v.facts || []).map((f) => ({ claim: f.claim || '', src: f.src || '' })) };
}
async function writeSection(sec) {
  const p = S.project; setErr('write', null);
  const n = (sec.slots || []).length > 10 ? 2 : (p.variantsCount || 3);
  let img = null; if (sec.preview && S.imgLimits) img = await blobFromUrl(sec.preview);
  setBusy('write', `نوشتن «${sec.name || sec.figmaName}»…`);
  try {
    let t;
    try { t = await ask(writePrompt(p, sec, n, !!img), { images: img ? [img] : null }); }
    catch (e) { if (img && (e.code === 'image_rejected' || e.code === 'images_unavailable')) t = await ask(writePrompt(p, sec, n, false)); else throw e; }
    const j = parseJSON(t);
    const variants = (j.variants || []).map((v) => cleanVariant(v, sec));
    if (!variants.length) throw { code: 'bad_json' };
    const rec = Math.min(Math.max(0, +j.recommended || 0), variants.length - 1);
    S.variantView[sec.id] = rec;
    await updateSection(sec.id, { variants, recommended: rec, recommendation: j.recommendation || '', notes: (j.notes || []).map(String), chosen: null, status: j.needs_data ? 'waiting' : 'review', writtenAt: now(), writtenBy: (S.me && S.me.id) || null });
    await updateProject({});
    return true;
  } catch (e) { setErr('write', sampleMsg(e)); return false; }
  finally { setBusy('write', null); }
}
async function writeAll() {
  const todo = sectionsIncluded().filter((s) => !(s.variants || []).length);
  for (let i = 0; i < todo.length; i++) {
    pickSection(todo[i].id);
    const ok = await writeSection(todo[i]);
    if (!ok) break;
  }
}
async function rewrite(instr) {
  const p = S.project; const sec = S.sections.find((s) => s.id === S.secId); if (!sec) return;
  const vi = curVariantIndex(sec); const v = sec.variants[vi]; if (!v || !instr.trim()) return;
  setErr('write', null); setBusy('write', 'بازنویسی…');
  const prompt = `${ROLE}
یک نسخه از متن سکشن «${sec.name || sec.figmaName}» را طبق دستور مدیر محصول بازنویسی کن.

${kitBlock()}

${projectBlock(p)}

## جای متن‌ها
${(sec.slots || []).map((s, i) => `- ${s.key} · ${slotLabel(s, i)} · ${s.size}px · حدود ${s.limit} کاراکتر`).join('\n')}

## نسخه فعلی
${JSON.stringify(v.fields)}

## دستور مدیر محصول
${instr}

همه قواعد کیت برند برقرار است. فقط یک شیء JSON برگردان:
{"variant":{"label":"بازنویسی","angle":"...","fields":{"s1":"..."},"why":["..."],"facts":[{"claim":"...","src":"..."}]}}`;
  try {
    const j = parseJSON(await ask(prompt));
    const nv = cleanVariant(j.variant || {}, sec); nv.label = 'بازنویسی: ' + clip(instr, 24);
    const variants = [...sec.variants, nv];
    S.variantView[sec.id] = variants.length - 1; S.rwText = '';
    await updateSection(sec.id, { variants, status: sec.status === 'approved' ? 'approved' : 'review' });
  } catch (e) { setErr('write', sampleMsg(e)); }
  finally { setBusy('write', null); }
}

async function runSeo() {
  const p = S.project; setErr('seo', null); setBusy('seo', 'ساخت متا و نقشه تگ‌ها…');
  const body = sectionsIncluded().map((s) => { const v = finalFields(s); return `### ${s.name || s.figmaName}${s.status === 'approved' ? '' : ' (تأییدنشده)'}\n` + (s.slots || []).map((x, i) => `- ${slotLabel(x, i)} (${x.size}px): ${v ? v[x.key] || '' : x.text}`).join('\n'); }).join('\n\n');
  const prompt = `${ROLE} کار تو الان سئوی همین لندینگ است.
${projectBlock(p)}
## متن صفحه به ترتیب
${clip(body, 36000)}
## کار
- Meta Title حداکثر ۶۰ کاراکتر با کلمه کلیدی اصلی و نام برند «ایران‌سرور».
- Meta Description حداکثر ۱۵۵ کاراکتر با دعوت به اقدام، بدون عدد ساختگی.
- نقشه تگ‌های عنوان: دقیقاً یک H1 (تیتر هیرو)، H2 برای تیتر هر سکشن، H3 برای کارت‌ها و سؤال‌های متداول، H4 فقط در صورت نیاز؛ متنی که تیتر نیست P. متن هر تگ عیناً همان متن صفحه باشد.
- اسکیماهای مناسب (FAQPage، VideoObject، BreadcrumbList و…)، پیشنهاد لینک داخلی، و نکته‌های لازم برای تیم فرانت.
فقط JSON: {"title":"...","desc":"...","tags":[{"tag":"H1","text":"...","section":"..."}],"schema":["FAQPage"],"links":["..."],"notes":["..."]}`;
  try {
    const j = parseJSON(await ask(prompt));
    await updateProject({ seo: { title: j.title || '', desc: j.desc || '', tags: (j.tags || []).map((t) => ({ tag: String(t.tag || 'P').toUpperCase(), text: t.text || '', section: t.section || '' })), schema: (j.schema || []).map(String), links: (j.links || []).map(String), notes: (j.notes || []).map(String), at: now() } });
  } catch (e) { setErr('seo', sampleMsg(e)); }
  finally { setBusy('seo', null); }
}

function finalFields(s) {
  if (s.final && s.final.fields) return s.final.fields;
  const v = (s.variants || [])[s.chosen != null ? s.chosen : (s.recommended || 0)];
  return v ? v.fields : null;
}
function exportParts(p) {
  const tagOf = (t) => { const x = ((p.seo && p.seo.tags) || []).find((g) => g.text && t && g.text.trim() === t.trim()); return x ? x.tag : null; };
  return sectionsIncluded().map((s) => ({ name: s.name || s.figmaName, approved: s.status === 'approved', items: (s.slots || []).map((x, i) => { const v = finalFields(s); const t = v ? v[x.key] || '' : ''; return { label: tagOf(t) || slotLabel(x, i), text: t }; }).filter((x) => x.text) }));
}
function exportHtml(p) {
  const parts = exportParts(p); const seo = p.seo;
  return `<html><head><meta charset="utf-8"></head><body dir="rtl" style="font-family:Tahoma">
<h1>${esc(p.name)}: متن صفحه</h1><p>${esc(p.url || '')}</p>
${seo ? `<h2>متا</h2><table border="1" cellpadding="6" style="border-collapse:collapse"><tr><td><b>Meta Title</b></td><td>${esc(seo.title)} (${fa((seo.title || '').length)} کاراکتر)</td></tr><tr><td><b>Meta Description</b></td><td>${esc(seo.desc)} (${fa((seo.desc || '').length)} کاراکتر)</td></tr><tr><td><b>اسکیما</b></td><td>${esc((seo.schema || []).join('، '))}</td></tr></table>` : ''}
${parts.map((s) => `<h2>${esc(s.name)}${s.approved ? '' : ' (تأییدنشده)'}</h2>${s.items.map((x) => `<p><b>[${esc(x.label)}]</b> ${esc(x.text).replace(/\n/g, '<br>')}</p>`).join('')}`).join('\n')}
${seo && (seo.notes || []).length ? `<h2>نکته‌های سئو برای تیم فرانت</h2><ul>${seo.notes.concat(seo.links || []).map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
</body></html>`;
}
function exportMd(p) {
  const seo = p.seo;
  return `# ${p.name}: متن صفحه\n\n${p.url || ''}\n\n` + (seo ? `## متا\n\n- Meta Title: ${seo.title}\n- Meta Description: ${seo.desc}\n\n` : '') +
    exportParts(p).map((s) => `## ${s.name}${s.approved ? '' : ' (تأییدنشده)'}\n\n` + s.items.map((x) => `**[${x.label}]** ${x.text}`).join('\n\n')).join('\n\n') + '\n';
}
async function exportGdoc() {
  const p = S.project; setErr('export', null); setBusy('export', 'ساخت گوگل داکس…');
  const title = `${p.name} - متن صفحه`;
  try {
    const r = await S.mcp.callTool(DRIVE, 'create_file', { title, textContent: exportHtml(p), contentMimeType: 'text/html' });
    const f = r.payload || {};
    const url = f.viewUrl || (f.id ? `https://docs.google.com/document/d/${f.id}/edit` : '');
    await updateProject({ exports: [...(p.exports || []), { title, url, at: now(), by: (S.me && S.me.id) || null }] });
    toast('گوگل داکس در درایو شما ساخته شد. از «خروجی‌های قبلی» بازش کنید.');
  } catch (e) { setErr('export', mcpMsg(e, DRIVE) + (e && (e.code === 'server_unavailable' || e.code === 'upstream_error') ? ' ممکن است فایل ساخته شده باشد؛ قبل از تلاش دوباره درایو را نگاه کنید.' : '')); }
  finally { setBusy('export', null); }
}

/* ---------- events ---------- */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const act = el.dataset.act; const p = S.project;
  if (['upload', 'include', 'audadd'].includes(act)) return;
  const sec = S.sections.find((s) => s.id === S.secId);
  switch (act) {
    case 'go': go(el.dataset.view); break;
    case 'new': newProject(); break;
    case 'open': if (S.pid !== el.dataset.id) openProject(el.dataset.id, 'inputs'); break;
    case 'filter': S.filter = el.dataset.f; render(); break;
    case 'tab': S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'own': updateProject({ ownerId: S.me.id }); break;
    case 'import': { const v = $('#f-figma'); if (v && v.value !== (p.figmaUrl || '')) { await updateProject({ figmaUrl: v.value.trim() }); p.figmaUrl = v.value.trim(); } importFigma(); break; }
    case 'suggest': { const f = el.dataset.field; const cur = convText((p.brief || {})[f]).trim(); if (cur.includes(el.dataset.v)) break; updateProject({ brief: { [f]: cur ? cur + '؛ ' + el.dataset.v : el.dataset.v } }); break; }
    case 'aud': { const a = new Set(p.brief && p.brief.audience || []); a.has(el.dataset.v) ? a.delete(el.dataset.v) : a.add(el.dataset.v); updateProject({ brief: { audience: [...a] } }); break; }
    case 'vcount': updateProject({ variantsCount: +el.dataset.n }); break;
    case 'analyze': analyze(); break;
    case 'answer': { const qs = p.analysis.questions.map((q, i) => i === +el.dataset.q ? { ...q, answer: q.answer === el.dataset.o ? '' : el.dataset.o } : q); updateProject({ analysis: { questions: qs } }); break; }
    case 'q2kit': { const q = p.analysis.questions[+el.dataset.q]; saveKit({ facts: [...((S.kit && S.kit.facts) || []), { k: q.text, v: q.answer, src: 'پاسخ مدیر محصول، ' + (p.name || '') }] }); toast('به واقعیت‌های کیت برند اضافه شد.'); break; }
    case 'fact-del': updateProject({ analysis: { facts: p.analysis.facts.filter((_, i) => i !== +el.dataset.i) } }); break;
    case 'sec': pickSection(el.dataset.id); break;
    case 'variant': S.variantView[S.secId] = +el.dataset.i; S.editing = false; render(); break;
    case 'write': if (sec) writeSection(sec); break;
    case 'write-all': writeAll(); break;
    case 'approve': { const vi = curVariantIndex(sec); updateSection(sec.id, { chosen: vi, status: 'approved', final: { fields: sec.variants[vi].fields, at: now(), by: (S.me && S.me.id) || null } }); updateProject({}); toast('سکشن تأیید شد.'); break; }
    case 'waiting': updateSection(sec.id, { status: sec.status === 'waiting' ? ((sec.variants || []).length ? 'review' : 'empty') : 'waiting' }); break;
    case 'edit': S.editing = true; render(); break;
    case 'edit-cancel': S.editing = false; render(); break;
    case 'edit-save': { const vi = curVariantIndex(sec); const fields = { ...sec.variants[vi].fields }; $$('[data-ef]').forEach((t) => { fields[t.dataset.ef] = t.value.trim(); }); const variants = sec.variants.map((v, i) => i === vi ? { ...v, fields, label: /ویرایش/.test(v.label) ? v.label : (v.label || '') + ' (ویرایش‌شده)' } : v); S.editing = false; await updateSection(sec.id, { variants, ...(sec.status === 'approved' && sec.chosen === vi ? { final: { fields, at: now(), by: (S.me && S.me.id) || null } } : {}) }); break; }
    case 'rw-quick': rewrite(el.dataset.v); break;
    case 'rewrite': { const t = $('#rw').value; S.rwText = t; rewrite(t); break; }
    case 'comment': { const t = $('#cm').value.trim(); if (!t || !sec) break; $('#cm').value = ''; S.db.collection(`projects/${S.pid}/sections/${sec.id}/comments`).add({ text: t, by: (S.me && S.me.id) || null, at: now() }).catch(dbFail); break; }
    case 'seo': runSeo(); break;
    case 'export-gdoc': exportGdoc(); break;
    case 'export-md': S.downloads.save({ filename: (p.name || 'page') + '.md', data: exportMd(p) }).catch((e) => { if (e && e.code !== 'declined') toast('دانلود انجام نشد.'); }); break;
    case 'copy': { const t = exportMd(p); try { await navigator.clipboard.writeText(t); toast('متن کپی شد.'); } catch (e) { toast('کپی انجام نشد؛ از دانلود Markdown استفاده کنید.'); } break; }
    case 'kit-row': { const k = el.dataset.k; const blank = k === 'tone' ? { rule: '', ex: '' } : k === 'facts' ? { k: '', v: '', src: '' } : { name: '', note: '', avoid: '' }; saveKit({ [k]: [...((S.kit && S.kit[k]) || []), blank] }); break; }
    case 'kit-del': { const k = el.dataset.k; saveKit({ [k]: ((S.kit && S.kit[k]) || []).filter((_, i) => i !== +el.dataset.i) }); break; }
    case 'kit-add': kitAdd(el.dataset.k); break;
  }
});
function kitAdd(k) { const inp = $('#kadd-' + k); const v = inp && inp.value.trim(); if (!v) return; inp.value = ''; saveKit({ [k]: [...((S.kit && S.kit[k]) || []), v] }); }
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' || ev.isComposing) return;
  const t = ev.target;
  if (t.dataset && t.dataset.kadd) { ev.preventDefault(); kitAdd(t.dataset.kadd); }
  if (t.dataset && t.dataset.act === 'audadd') { ev.preventDefault(); const v = t.value.trim(); if (!v) return; t.value = ''; const a = new Set((S.project.brief && S.project.brief.audience) || []); a.add(v); updateProject({ brief: { audience: [...a] } }); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target; const p = S.project;
  if (t.dataset.act === 'upload') { if (t.files && t.files.length) uploadImages(t.files); t.value = ''; return; }
  if (t.dataset.act === 'include') { updateSection(t.dataset.id, { include: t.checked }); return; }
  if (t.dataset.p && p) { if (t.type === 'radio' && !t.checked) return; updateProject(nested(t.dataset.p, t.value)); return; }
  if (t.dataset.qfree != null && p) { const qs = p.analysis.questions.map((q, i) => i === +t.dataset.qfree ? { ...q, answer: t.value.trim() } : q); updateProject({ analysis: { questions: qs } }); return; }
  if (t.dataset.kp) { const [k, i, f] = t.dataset.kp.split('.'); const arr = ((S.kit && S.kit[k]) || []).map((x, j) => j === +i ? { ...x, [f]: t.value } : x); saveKit({ [k]: arr }); return; }
});
document.addEventListener('input', (ev) => { if (ev.target.id === 'rw') S.rwText = ev.target.value; });
window.addEventListener('hashchange', route);
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('p-')) { const id = h.slice(2); if (S.pid !== id) openProject(id, S.tab || 'inputs'); }
  else if (h === 'kit') { if (S.view !== 'kit') go('kit'); }
  else if (h === 'projects' && S.view !== 'projects') go('projects');
}

/* ---------- boot ---------- */
async function boot() {
  const c = window.claude;
  if (!c || !c.use) { S.fatal = 'این صفحه فقط داخل claude.ai کار می‌کند. لینک ایجنت را در claude.ai باز کنید.'; render(); return; }
  const get = (n) => c.use(n).catch(() => null);
  [S.db, S.user, S.mcp, S.sample, S.assets, S.downloads] = await Promise.all(['db', 'user', 'mcp', 'sample', 'assets', 'downloads'].map(get));
  if (!S.db) { S.fatal = 'ذخیره مشترک در این نما در دسترس نیست. صفحه را با حساب سازمانی ایران‌سرور در claude.ai باز کنید.'; render(); return; }
  if (S.user) S.me = await S.user.me();
  if (S.sample) { try { S.imgLimits = ((await S.sample.limits()) || {}).images || null; } catch (e) { S.imgLimits = null; } }
  S.db.doc('kit/main').onSnapshot((s) => { S.kitExists = s.exists; S.kit = s.exists ? s.data() : emptyKit(); S.kitLoaded = true; render(); }, () => {});
  S.db.collection('projects').orderBy('updatedAt', 'desc').onSnapshot((q) => { S.projects = q.docs.map((d) => ({ id: d.id, ...d.data() })); S.projectsLoaded = true; render(); }, () => { S.projectsLoaded = true; render(); });
  S.ready = true;
  if (location.hash) route(); else render();
}
render();
boot();
</script>
